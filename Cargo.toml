[package]
name = "gifmeme"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
bytes = "1.12.1"
deunicode = "1.6.2"
getrandom = "0.3"
hex = "0.4.3"
hickory-resolver = { version = "0.26.3", features = ["tokio"] }
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "stream", "hickory-dns"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
